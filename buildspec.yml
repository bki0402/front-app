version: 0.2
phases:
  build:
    commands:
      - $(aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 539920679315.dkr.ecr.ap-northeast-2.amazonaws.com)
      - docker build -t 539920679315.dkr.ecr.ap-northeast-2.amazonaws.com/2team/front:latest ./front-app
      - docker build -t 539920679315.dkr.ecr.ap-northeast-2.amazonaws.com/2team/backend:latest ./backend
      - docker push 539920679315.dkr.ecr.ap-northeast-2.amazonaws.com/2team/front:latest
      - docker push 539920679315.dkr.ecr.ap-northeast-2.amazonaws.com/2team/backend:latest
